[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "helpdesk"
version = "0.1.0"
description = "Help Desk RAG: helpdesk-api and ingestion-worker share this one package."
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "charset-normalizer>=3.4,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "markdown-it-py>=3,<5",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "PyYAML>=6,<7",
  "qdrant-client==1.18.0",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "structlog>=24.4,<26",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
helpdesk-api = "helpdesk.presentation.api.main:main"
helpdesk-worker = "helpdesk.presentation.worker.cli:main"

[project.optional-dependencies]
ml = [
  "sentence-transformers>=3.3,<6",
  "transformers>=4.46,<6",
  # Linux containers must use the CPU wheel. Keeping torch as a direct,
  # platform-qualified dependency prevents sentence-transformers from
  # silently selecting PyPI's CUDA-enabled Linux build.
  "torch==2.11.0+cpu; sys_platform == 'linux'",
  "torch==2.11.0; sys_platform != 'linux'",
]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "testcontainers[postgres]>=4.9,<5",
  "types-PyYAML>=6,<7",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/helpdesk"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: requires Docker for ephemeral PostgreSQL 16 and Qdrant containers",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["helpdesk"]

[tool.ruff.lint.per-file-ignores]
# Production code intentionally contains Traditional Chinese docstrings and comments.
"src/**/*.py" = ["RUF002", "RUF003"]
# PDF 章節規則比對的就是全形標點。
"src/helpdesk/infrastructure/parsers/pdf_structure.py" = ["RUF001"]
"migrations/**/*.py" = ["RUF002", "RUF003"]
"tests/**/*.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

# pytest imports NumPy, and NumPy's stubs on Python 3.13 use syntax that a
# Python 3.11 type-check target rejects. Nothing here depends on NumPy's types.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

# 只有 ml extra 會裝 sentence-transformers；在 Intel Mac 上沒有 torch wheel。
[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["helpdesk"]
branch = true
