<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Help Desk RAG 本機 Demo">
    <title>Help Desk</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar" aria-label="對話清單">
        <div class="sidebar-header">
          <p class="eyebrow">Help Desk RAG</p>
          <button id="new-conversation" class="primary wide" type="button">新對話</button>
        </div>
        <nav>
          <ul id="conversation-list" class="conversation-list"></ul>
          <p id="conversation-empty" class="sidebar-empty">還沒有對話。</p>
          <button id="load-more" class="secondary wide hidden" type="button">載入更多</button>
        </nav>
      </aside>

      <main class="shell">
        <header class="page-header">
          <h1 id="conversation-title">新對話</h1>
        </header>

        <aside class="demo-notice" role="note">
          本頁是本機 Demo，沒有正式登入。存取控制關閉時，每個瀏覽器以匿名 ID 區分自己的對話。
          追問會參考同一個對話裡已完成的問答。
        </aside>

        <section id="status" class="status" role="status" aria-live="polite">輸入問題開始對話。</section>
        <section id="messages" class="messages" aria-live="polite" aria-label="對話訊息">
          <p id="empty-state" class="empty-state">輸入公司規章或招生簡章相關的問題。</p>
        </section>

        <section class="composer" aria-label="問題輸入">
          <label for="question">問題</label>
          <textarea id="question" maxlength="20000" rows="4" placeholder="例如：碩士在職專班的報名時間是什麼時候？"></textarea>
          <div class="composer-footer">
            <span id="counter">0 / 20,000</span>
            <div class="composer-actions">
              <button id="confirm-request" class="secondary hidden" type="button">確認原請求結果</button>
              <button id="send" class="primary" type="button">送出</button>
            </div>
          </div>
          <p class="hint">Enter 換行；Ctrl+Enter（macOS 為 Cmd+Enter）送出。</p>
        </section>
      </main>
    </div>
  </body>
</html>
